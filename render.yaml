services:
  - type: web
    name: image-forgery-detection
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd web_app && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
